[project]
name = "mqtt-tester"
version = "0.1.0"
description = "MQTT testers emulating IoT devices that publish temperature telemetry (Paho MQTT 2.x)"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "pyyaml>=6.0",
]

[project.scripts]
mqtt-device-producer = "mqtt_tester.json_producer:main"
mqtt-telemetry-consumer = "mqtt_tester.json_consumer:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mqtt_tester"
