[project]
name = "mqtt-data-fetcher"
version = "0.1.0"
description = "MQTT Data Fetcher microservice registering the devices that publish telemetry into the IoT Inventory API"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
mqtt-data-fetcher = "mqtt_data_fetcher.data_fetcher:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mqtt_data_fetcher"
